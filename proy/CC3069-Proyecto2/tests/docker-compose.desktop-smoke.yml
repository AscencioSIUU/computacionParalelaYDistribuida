services:
  worker2:
    image: mpi-cluster-desktop
    platform: linux/amd64
    hostname: mpi-worker2
    environment:
      MPI_DESKTOP_ROLE: worker
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    command: ["/usr/sbin/sshd", "-D", "-e", "-o", "PermitTunnel=point-to-point"]
    ports: ["127.0.0.1:32223:22"]
    volumes: [worker2-ssh:/root/.ssh]
    networks: [worker2-network]
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 1 127.0.0.1 >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

networks:
  worker2-network:

volumes:
  worker2-ssh:
