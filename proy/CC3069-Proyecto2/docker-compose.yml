x-node: &node
  image: mpi-cluster-image
  networks: [mpicluster]
  healthcheck:
    test: ["CMD-SHELL", "ssh-keyscan -T 1 127.0.0.1 >/dev/null 2>&1"]
    interval: 2s
    timeout: 3s
    retries: 15
    start_period: 5s

services:
  maestro:
    <<: *node
    build: .
    container_name: mpi_maestro
    hostname: maestro
    volumes: [maestro-ssh:/root/.ssh]

  worker1:
    <<: *node
    container_name: mpi_worker1
    hostname: worker1
    volumes: [worker1-ssh:/root/.ssh]

  worker2:
    <<: *node
    container_name: mpi_worker2
    hostname: worker2
    volumes: [worker2-ssh:/root/.ssh]

networks:
  mpicluster:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.0.0/24

volumes:
  maestro-ssh:
  worker1-ssh:
  worker2-ssh:
